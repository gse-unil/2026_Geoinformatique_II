name: Colab Badges
# Adds / updates the "Open in Colab" badges in the Python TPs.
#
# The notebooks contain a `{{ badge }}`-free, pre-inserted badge cell
# (marked with <!--<badge>--> ... <!--</badge>-->) in tracked form.
# This action keeps the Colab badge URL in sync when notebooks move or
# when the branch / repository changes, and inserts it into any notebook
# that does not have one yet.
#
# Runs on push to main, so the badges always point at the published site.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add/update Colab badges
        uses: trsvchn/colab-badge-action@v4
        with:
          check: "all"                # scan every notebook on every run
          target_repository: gse-unil/2026_Geoinformatique_II
          target_branch: main
          update: true                # keep tracked badges in sync
          verbose: true

      - name: Commit and push badge updates
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: sync Colab badges"
          file_pattern: "tps/*.ipynb"
          skip_fetch: true
